name: Verifica pre-rilascio (senza pubblicazione)
on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compila il sito ed esegui tutti i test preflight
        run: node deploy-build.cjs
      - name: Controlla file pubblicati senza effettuare deploy
        run: |
          test -f dist/index.html
          test -f dist/gestionale/index.html
          test -f dist/site-enhancements.js
          test -f dist/manifest.webmanifest
          echo "Preflight and static build completed; no deployment."
