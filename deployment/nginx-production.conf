# Template only: activate after TLS, provider, scanner and restore tests pass.
# Include inside nginx's http context. Certificates must already exist.
server {
    listen 80;
    server_name cafpuntocittadino.it www.cafpuntocittadino.it;
    return 308 https://cafpuntocittadino.it$request_uri;
}
server {
    listen 443 ssl;
    server_name www.cafpuntocittadino.it;
    ssl_certificate /etc/letsencrypt/live/cafpuntocittadino.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafpuntocittadino.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://cafpuntocittadino.it$request_uri;
}
server {
    listen 443 ssl;
    server_name cafpuntocittadino.it;
    ssl_certificate /etc/letsencrypt/live/cafpuntocittadino.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafpuntocittadino.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 14m;
    client_body_timeout 15s;
    # Avoid persisting personal URLs, cancellation codes and IPs in access logs.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host cafpuntocittadino.it;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Do not write incoming documents or private downloads to proxy temp files.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        # Avoid replaying non-idempotent bookings/uploads after upstream failures.
        proxy_next_upstream off;
        proxy_read_timeout 50s;
        proxy_send_timeout 50s;
    }
}
