# Enable only after the new domain, certificates and Google redirects are verified.
# Keep the existing DNS/email records until the transfer and mail checks complete.
server {
    listen 80;
    server_name cafpuntocittadino.it www.cafpuntocittadino.it;
    return 308 https://puntocittadinoitalia.it$request_uri;
}
server {
    listen 443 ssl;
    server_name cafpuntocittadino.it www.cafpuntocittadino.it;
    ssl_certificate /etc/letsencrypt/live/cafpuntocittadino.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafpuntocittadino.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    return 308 https://puntocittadinoitalia.it$request_uri;
}
