# Certificate renewal bootstrap only; does not expose the application.
# Replace with nginx-production.conf after the release checks pass.
server {
    listen 80;
    server_name puntocittadinoitalia.it www.puntocittadinoitalia.it;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
