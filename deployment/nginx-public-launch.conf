# Contact-only launch. No private runtime, uploads, Google API or paid AI calls.
server {
 listen 80;
 server_name puntocittadinoitalia.it www.puntocittadinoitalia.it;
 access_log off;
 location ^~ /.well-known/acme-challenge/ {
  root /var/lib/letsencrypt;
  default_type text/plain;
  try_files $uri =404;
 }
 location / { return 308 https://puntocittadinoitalia.it$request_uri; }
}
server {
 listen 443 ssl;
 server_name www.puntocittadinoitalia.it;
 access_log off;
 ssl_certificate /etc/letsencrypt/live/puntocittadinoitalia.it/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/puntocittadinoitalia.it/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 return 308 https://puntocittadinoitalia.it$request_uri;
}
server {
 listen 443 ssl;
 server_name puntocittadinoitalia.it;
 ssl_certificate /etc/letsencrypt/live/puntocittadinoitalia.it/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/puntocittadinoitalia.it/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /opt/cafpuntocittadino/dist;
 index index.html;
 access_log off;
 autoindex off;
 client_max_body_size 1k;
 client_body_timeout 5s;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Strict-Transport-Security "max-age=86400" always;
 add_header Cache-Control "no-cache" always;
 if ($request_method !~ ^(GET|HEAD)$) { return 405; }
 location ^~ /api/ {
  default_type application/json;
  return 503 '{"error":"Area riservata in preparazione. Contatta la sede senza allegare documenti."}';
 }
 location ^~ /.netlify/functions/ {
  default_type application/json;
  return 503 '{"error":"Funzione in preparazione. Per appuntamenti scrivi via email o WhatsApp."}';
 }
 location ~ /\. { return 404; }
 location / { try_files $uri $uri/ =404; }
}
