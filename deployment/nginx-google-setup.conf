# Temporary provisioning only. Disable after Google authorization.
# Keep the separate port-80 ACME listener. This does not expose the application.
server {
    listen 443 ssl;
    server_name puntocittadinoitalia.it;
    ssl_certificate /etc/letsencrypt/live/puntocittadinoitalia.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puntocittadinoitalia.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # OAuth query strings must not appear in upstream error logs.
    error_log /dev/null crit;
    location ^~ /__google_setup/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host puntocittadinoitalia.it;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 30s;
    }
    location = /.netlify/functions/google-calendar-callback {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host puntocittadinoitalia.it;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
