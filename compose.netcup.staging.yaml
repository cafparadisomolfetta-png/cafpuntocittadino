# Netcup isolated preview, not production; do not connect public DNS.
services:
  sito-staging:
    build:
      context: .
      dockerfile: Dockerfile.netcup
    image: punto-cittadino-staging:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      NODE_ENV: "production"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
# Google and database credentials intentionally omitted.
