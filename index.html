<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAF Punto Cittadino</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #243238;
    }

    header {
      background: #087f83;
      color: white;
      padding: 35px 20px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; font-size: 30px; }
    header p { margin: 0; font-size: 17px; }

    main {
      max-width: 800px;
      margin: auto;
      padding: 25px 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px #00000012;
    }

    h2 {
      color: #087f83;
      margin-top: 0;
    }

    ul {
      line-height: 1.8;
      padding-left: 22px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd5d8;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    button, .btn {
      display: block;
      width: 100%;
      border: 0;
      background: #087f83;
      color: white;
      text-decoration: none;
      text-align: center;
      padding: 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-secondario {
      background: #66757a;
    }

    .btn-rosso {
      background: #b83232;
    }

    .orari {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .orario {
      padding: 12px 6px;
      border: 2px solid #087f83;
      border-radius: 9px;
      background: white;
      color: #087f83;
      font-weight: bold;
      cursor: pointer;
    }

    .orario.selezionato {
      background: #087f83;
      color: white;
    }

    .messaggio {
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      display: none;
    }

    .successo {
      display: block;
      background: #e8f7ef;
      color: #17653a;
    }

    .errore {
      display: block;
      background: #fdecec;
      color: #9b2525;
    }
